worker_processes auto;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 10m;

    # --- Access logging ---
    #
    # Both SPAs run the authorization-code flow with responseMode 'query' (see the initOptions
    # comment in frontend/{web,mobile}/src/lib/keycloak.ts), so every login lands here as
    # `GET /?code=...&state=...`. nginx's built-in `combined` format logs $request verbatim,
    # which would write that authorization code -- a credential in transit -- into the container
    # log, where log shipping, a support bundle or a screenshot of a tail would re-expose it.
    #
    # Only a request whose query carries a credential gets its query string dropped; every other
    # request logs its raw request line exactly as `combined` would, so a malformed request that
    # nginx rejects with 400 still shows what the client actually sent. Credential-bearing
    # referrers are replaced in full because a callback URL can be forwarded by SPA subrequests.
    #
    # Exactly two kinds of credential-bearing query actually traverse this proxy:
    #   * `code=` on the authorization callback, from either SPA;
    #   * `id_token_hint=` on RP-initiated logout. keycloak-js puts the full signed ID token there
    #     (`keycloak.logout({redirectUri})` in both adapters), and `location /auth/` proxies that
    #     request here, so the pattern must match the `_hint` suffix -- a bare `id_token=` never
    #     fires and would leave a decodable JWT carrying username, email, roles and session id in
    #     this log on every sign-out.
    # `access_token`, `refresh_token`, `client_secret` and `password` are future-proofing: no
    # endpoint in this deployment accepts them today, and they cost nothing to keep.
    #
    # `state` and `session_state` are deliberately NOT triggers, and must not be added back.
    # `state` is a live application filter (@QueryParam("state") on delivery orders, ASNs, goods
    # receipts, transport orders, waves and cross-dock orders), so matching it would blank the
    # query of ordinary requests such as `/api/v1/delivery-orders?state=300&page=2&sort=created,desc`
    # and hide exactly what an operator diagnosing that request needs. Nothing is lost by leaving
    # them out: the authorization callback always carries `code=`, and `session_state` only ever
    # appears alongside it, so the whole callback query is still redacted.

    map $request_uri $logged_path {
        "~^([^?]*)"  $1;
        default      $request_uri;
    }

    map $args $logged_request {
        "~*(^|&)(code|access_token|id_token(_hint)?|refresh_token|client_secret|password)="
            "$request_method $logged_path?[redacted] $server_protocol";
        default
            "$request";
    }

    map $http_referer $logged_referer {
        "~*[?&](code|access_token|id_token(_hint)?|refresh_token|client_secret|password)="
            "[redacted]";
        default
            "$http_referer";
    }

    log_format karyo '$remote_addr - $remote_user [$time_local] '
                     '"$logged_request" '
                     '$status $body_bytes_sent "$logged_referer" "$http_user_agent" '
                     'rt=$request_time urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log karyo;

    # --- Upstream definitions ---

    upstream karyo-app {
        server karyo-app:8080;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name _;

        # --- Application API (modular monolith serves all /api routes) ---

        # /api/internal/* is a dead router left over from the microservice era: since the
        # modulith pivot, cross-module calls are SPI bean injection, not REST, and no
        # production code calls these endpoints. They were still reachable from the public
        # internet through the /api/ rule below. Blocked here as defence-in-depth; the
        # resources themselves are deleted in the app. More specific prefix wins in nginx,
        # so this takes precedence over `location /api/` regardless of ordering.
        location /api/internal/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://karyo-app;
            include proxy_params.conf;
        }

        # SmallRye health (B17 admin Health page). Scoped to /q/health only —
        # the rest of the /q/ management namespace (metrics, etc.) stays private.
        location /q/health {
            proxy_pass http://karyo-app;
            include proxy_params.conf;
        }

        # --- Keycloak (authentication) ---

        location /auth/ {
            proxy_pass http://keycloak/auth/;
            include proxy_params.conf;

            # Preserve original Host with port so Keycloak generates correct URLs
            # (e.g. localhost:8080 via SSH tunnel instead of localhost:80)
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;

            # Keycloak responses can be large (tokens, JWKS)
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Keycloak theme resources and realm endpoints served without /auth/ prefix
        # when KC_HOSTNAME is set (Keycloak 26 behavior)
        location /resources/ {
            proxy_pass http://keycloak/auth/resources/;
            include proxy_params.conf;
        }

        location /realms/ {
            proxy_pass http://keycloak/auth/realms/;
            include proxy_params.conf;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Floor PWA (separate SPA served under /m)
        location /m/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /m/index.html;
        }

        # --- SPA catch-all (must be last) ---

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
