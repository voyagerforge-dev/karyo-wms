# Test profile for the modular monolith (union of the four former service test configs).
# Compose Dev Services (compose-devservices.yml) is disabled in tests -- use ephemeral
# Testcontainers Dev Services instead so every run starts from a clean database.
quarkus.compose.devservices.enabled=false

# PostgreSQL Dev Services -- single datasource, single `karyo` schema (created by Flyway)
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.db-name=karyo_test

# Keycloak Dev Services for tests (most tests mock auth via @TestSecurity)
quarkus.keycloak.devservices.enabled=true

# Disable telemetry for tests
quarkus.otel.enabled=false

# Disable scheduler during tests
quarkus.scheduler.enabled=false

# SC16: pins the MicroProfile-config rung of the SystemPropertyService fallback ladder
# (SystemPropertyServiceTest) -- a key that exists ONLY as config, never as a DB row.
karyo.test.system-property-config-rung=from-config
