name: karyo-dev
services:
  postgresql:
    image: docker.io/postgres:16-alpine
    ports:
      - "5432"
    environment:
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
      POSTGRES_DB: karyo
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8180:8080"
    environment:
      JAVA_OPTS_APPEND: -Dkeycloak.import.replace-placeholders=true
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ../../../../../infrastructure/keycloak/karyo-realm.json:/opt/keycloak/data/import/karyo-realm.json:ro

volumes:
  pgdata:
